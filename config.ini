[constants]
board_dim = 90
vec_dim = 65
action_dim = 34

[env]
lexicon = nwl23
restrict_pass = true

[arc]
network = mlp
num_blocks = 3
d_model = 512
dff = 512
num_heads = 8
top_k = 32

[train]
discount = 0.999
lr = 1e-4
batch_size = 32
steps = 2
temp = 0.1
dir_name = /content/drive/MyDrive/Games/scrabble/
run_name = groove
games_per_round = 2
steps_per_sample = 0.8
epsilon_greedy = 0.01
num_states_in_buffer = 100000
rounds_per_checkpoint = 200
buffer_dir = /content/states/
